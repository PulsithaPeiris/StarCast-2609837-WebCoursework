<!DOCTYPE html>
<html>
    <head>
        <title>StarCast | Where Every Story Finds Its Audience | Movies & Rating</title>
        <link rel = "stylesheet" href = "CSS/Global.css">
    </head>
    <body>
        <div class = "header">
            <a href = "HomePage.html"><img src = "Images/StarCast-Logo/StarCast-Logo-HW.png" alt = "StarCast-logo" width = 200 height = 70></a>
            <div class = "navbar">
                <a href = "HomePage.html" class = "hover-effect">Home</a>
                <a href = "MoviesAndRatingPage.html" class = "hover-effect" id = "current">Movies & Ratings</a>
                <a href = "FeedbackPage.html" class = "hover-effect">Feedback Form</a>
            </div>
            <div class = "right-side-buttons">
                <div class = "movie-search">
                    <input type = "text" id = "movie-search" name = "homepage-search" placeholder = "Search movies...">
                    <img src = "Images/Icons/Search-Icon.png" alt = "search-icon" width = 20 height = 20>
                </div>
                <button type = "button" id = "sign-in-button">SIGN IN</button>
            </div>
        </div>
        <hr>
        <div class = "filter-section">
            <div class = "filters">
                <p>Filter Genre :</p>
                <button type = "button" class = "filter all-genre active" data-genre = "allGenre">All Genres</button>
                <button type = "button" class = "filter" data-genre = "ACTION">Action</button>
                <button type = "button" class = "filter" data-genre = "COMEDY">Comedy</button>
                <button type = "button" class = "filter" data-genre = "DRAMA">Drama</button>
                <button type = "button" class = "filter" data-genre = "SCIENCE FICTION">Science Fiction</button>
            </div>
        </div>
        <div class = "movies">
            <div class = "movies-container" id = "movies-container">
            </div>
        </div>
        <div class = "footer">
            <hr class = "footer-top-divider">
            <div class = "footer-columns">
                <div class = "left-side-container">
                    <img src = "Images/StarCast-Logo/StarCast-Logo-HW.png" alt = "StarCast-logo" width = 100 height = 35>
                    <p>Where Every Story Finds Its Audience</p>
                    <p id = "copyright-text">© 2026 StarCast. All rights reserved.</p>
                </div>
                <div class = "right-side-container">
                    <a href = "HomePage.html">Home |</a>
                    <a href = "MoviesAndRatingPage.html"> Movies & Ratings | </a>
                    <a href = "FeedbackPage.html">Feedback Form</a>
                </div>
            </div>
        </div>
    <script src = "JS/ScriptMovieRatingPage.js"></script>
    </body>
</html>
